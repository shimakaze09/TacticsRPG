# CI for TacticsRPG (issue #7): from a clean checkout with no pre-generated
# content, validate + regenerate content, compile, run the battle probe
# suite, and enforce the balance report's hard invariants. A Windows build
# artifact is produced on pushes to main.
#
# Requires repository secrets (Settings → Secrets and variables → Actions):
#   UNITY_EMAIL / UNITY_PASSWORD — a Unity account holding a Personal (free)
#   license. Headless login cannot answer a two-factor prompt: use a
#   dedicated CI account with 2FA disabled, or additionally provide
#   UNITY_LICENSE (the contents of a Personal .ulf file — still free tier),
#   which takes precedence when present.
# See Docs/ARCHITECTURE.md §8 for the local forms of these commands.

name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  UNITY_VERSION: 6000.5.5f1

jobs:
  validate:
    name: Generate, compile, and probe
    runs-on: ubuntu-latest
    container:
      # game-ci editor image matching ProjectSettings/ProjectVersion.txt
      image: unityci/editor:ubuntu-6000.5.5f1-base-3
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Check license secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::Configure UNITY_EMAIL + UNITY_PASSWORD (2FA-free account) or UNITY_LICENSE — see the header of this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            library-${{ env.UNITY_VERSION }}-

      # Activation must verifiably succeed before anything else runs — a
      # swallowed failure here just resurfaces as an opaque exit 198 later
      - name: Activate Unity license
        run: |
          mkdir -p logs
          if [ -n "$UNITY_LICENSE" ]; then
            echo "$UNITY_LICENSE" > /tmp/Unity_lic.ulf
            unity-editor -batchmode -nographics -quit \
              -manualLicenseFile /tmp/Unity_lic.ulf \
              -logFile logs/activation.log || true
          else
            unity-editor -batchmode -nographics -quit \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
              -logFile logs/activation.log || true
          fi
          if grep -qE "No valid Unity Editor license|Cannot load ULF|Signature element not found|Licensing::Client\] Error: Code 4" logs/activation.log; then
            echo "::error::Unity license activation failed. UNITY_LICENSE must be the COMPLETE .ulf XML (signature included); with email/password the account must not have 2FA enabled. See logs artifact: activation.log."
            exit 1
          fi
          echo "License activation verified."

      # A clean checkout has no generated Jobs/Abilities/Catalog assets —
      # this validates the JSON cross-references and generates all three in
      # order, exiting non-zero on any validation or generation error.
      # Script compilation happens on editor startup: compile errors mean the
      # entry method never runs and the step fails.
      #
      # Credentials ride along ONLY in email/password mode: with a .ulf
      # active, -username/-password makes the editor attempt a cloud login
      # that fails (401) and overrides the valid local license.
      - name: Validate and generate content
        run: |
          if [ -z "$UNITY_LICENSE" ]; then set -- -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"; else set --; fi
          unity-editor -batchmode -nographics -projectPath . "$@" \
            -executeMethod ContentGenerationMenu.RunHeadless \
            -logFile logs/generate.log

      - name: Run battle probes
        run: |
          if [ -z "$UNITY_LICENSE" ]; then set -- -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"; else set --; fi
          unity-editor -batchmode -nographics -projectPath . "$@" \
            -executeMethod BattleProbeMenu.RunHeadless \
            -logFile logs/probes.log

      - name: Balance report (hard invariants)
        run: |
          if [ -z "$UNITY_LICENSE" ]; then set -- -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"; else set --; fi
          unity-editor -batchmode -nographics -projectPath . "$@" \
            -executeMethod BalanceReportGenerator.RunHeadless \
            -logFile logs/balance.log

      # An email/password entitlement holds a seat on this runner — give it
      # back. A manual .ulf license has no floating seat to return.
      - name: Return Unity license
        if: always()
        run: |
          if [ -n "$UNITY_LICENSE" ]; then echo "Manual .ulf license — nothing to return."; exit 0; fi
          unity-editor -batchmode -nographics -quit -returnlicense \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
            -logFile logs/return-license.log || true

      - name: Upload logs and balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-and-reports
          path: |
            logs/
            BalanceReport/
          if-no-files-found: warn

  build:
    name: Windows build artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: library-build-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            library-build-${{ env.UNITY_VERSION }}-

      # CIBuild.Build regenerates content via the validated pipeline before
      # building, so the artifact never ships without generated assets
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.5.5f1
          targetPlatform: StandaloneWindows64
          buildName: TacticsRPG
          buildMethod: CIBuild.Build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TacticsRPG-StandaloneWindows64
          path: build/StandaloneWindows64
