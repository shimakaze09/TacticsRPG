name: Bug report
description: Report reproducible incorrect behavior in gameplay, tools, builds, or data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve TacticsRPG. Please describe one reproducible problem per issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or branch where the problem occurs.
  - type: input
    id: unity
    attributes:
      label: Unity and operating-system version
      placeholder: Unity 6000.5.5f1, Windows 11
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or recordings
      description: Remove secrets and personal data before attaching evidence.
  - type: markdown
    attributes:
      value: |
        ## Classification
        Choose the requested planning labels below. A maintainer must apply the
        matching `priority:*`, `group:*`, `phase:*`, and `weight:*` labels before
        implementation starts.
  - type: dropdown
    id: priority
    attributes:
      label: Importance
      options:
        - "priority: blocker"
        - "priority: critical"
        - "priority: high"
        - "priority: medium"
        - "priority: low"
    validations:
      required: true
  - type: dropdown
    id: group
    attributes:
      label: Primary feature group
      options:
        - "group: core-flow"
        - "group: combat-rules"
        - "group: status"
        - "group: balance"
        - "group: jobs"
        - "group: progression"
        - "group: equipment-economy"
        - "group: persistence"
        - "group: ai"
        - "group: ui-ux"
        - "group: content-chapter1"
        - "group: story-world"
        - "group: art-audio"
        - "group: input-accessibility"
        - "group: tooling-architecture"
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Earliest delivery phase
      options:
        - "phase: 0-stabilize"
        - "phase: 1-core-loop"
        - "phase: 2-vertical-slice"
        - "phase: 3-tactical-identity"
        - "phase: 4-campaign"
    validations:
      required: true
  - type: dropdown
    id: weight
    attributes:
      label: Relative weight
      description: Use 13 only for an epic that must be split before implementation.
      options:
        - "weight: 1"
        - "weight: 2"
        - "weight: 3"
        - "weight: 5"
        - "weight: 8"
        - "weight: 13"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I generated Abilities, Catalogs, and Jobs in the documented order.
        - label: I searched open and closed issues for duplicates.
          required: true
        - label: I understand implementation waits until the four matching tracker labels are applied.
          required: true
