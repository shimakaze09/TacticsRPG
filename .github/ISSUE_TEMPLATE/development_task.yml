name: Development task
description: Define a bounded engineering, content, documentation, or test task.
title: "[Task] "
labels: ["enhancement"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What current limitation or dependency makes this work necessary?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Behavior is implemented.
        - [ ] Relevant probes/tests pass.
        - [ ] Documentation is updated where public behavior changed.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Name the Unity checks, probes, tests, or manual scenarios required.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related issues
  - type: markdown
    attributes:
      value: |
        ## Classification
        Choose the requested planning labels below. A maintainer must apply the
        matching `priority:*`, `group:*`, `phase:*`, and `weight:*` labels before
        implementation starts.
  - type: dropdown
    id: priority
    attributes:
      label: Importance
      options:
        - "priority: blocker"
        - "priority: critical"
        - "priority: high"
        - "priority: medium"
        - "priority: low"
    validations:
      required: true
  - type: dropdown
    id: group
    attributes:
      label: Primary feature group
      options:
        - "group: core-flow"
        - "group: combat-rules"
        - "group: status"
        - "group: balance"
        - "group: jobs"
        - "group: progression"
        - "group: equipment-economy"
        - "group: persistence"
        - "group: ai"
        - "group: ui-ux"
        - "group: content-chapter1"
        - "group: story-world"
        - "group: art-audio"
        - "group: input-accessibility"
        - "group: tooling-architecture"
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Earliest delivery phase
      options:
        - "phase: 0-stabilize"
        - "phase: 1-core-loop"
        - "phase: 2-vertical-slice"
        - "phase: 3-tactical-identity"
        - "phase: 4-campaign"
    validations:
      required: true
  - type: dropdown
    id: weight
    attributes:
      label: Relative weight
      description: Use 13 only for an epic that must be split before implementation.
      options:
        - "weight: 1"
        - "weight: 2"
        - "weight: 3"
        - "weight: 5"
        - "weight: 8"
        - "weight: 13"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This task is bounded enough for one reviewable pull request.
          required: true
        - label: I searched open and closed issues for duplicates.
          required: true
        - label: I understand implementation waits until the four matching tracker labels are applied.
          required: true
